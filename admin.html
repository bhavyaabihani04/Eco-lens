<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoLens Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-container">

        <h1>EcoLens Admin</h1>

        <div id="login-section">

            <h2>Admin Login</h2>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="login-message"></p>

        </div>


        <div id="dashboard-section" style="display:none;">

    <h2>EcoLens Dashboard</h2>

    <button id="logout-button">Logout</button>

    <hr>

    <h3>Create New Article</h3>

    <form id="article-form" onsubmit="return false;">

        <label>Title</label><br>
        <input type="text" id="title" required><br><br>

        <label>Author</label><br>
        <input type="text" id="author" value="EcoLens" required><br><br>

        <label>Category</label><br>
        <input type="text" id="category" placeholder="Economics" required><br><br>

        <label>Excerpt</label><br>
        <textarea id="excerpt" rows="3" required></textarea><br><br>

        <label>Article Content</label><br>
        <textarea id="content" rows="15" required></textarea><br><br>

        <label>Image URL</label><br>
        <input type="url" id="image_url" placeholder="https://..."><br><br>

        <button type="submit">Publish Article</button>

    </form>

    <p id="article-message"></p>

</div>

    </main>

    <script type="module" src="admin.js"></script>

</body>
</html>
