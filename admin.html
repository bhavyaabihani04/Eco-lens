<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoLens Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-container">

        <h1>EcoLens Admin</h1>

        <div id="login-section">

            <h2>Admin Login</h2>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="login-message"></p>

        </div>


        <div id="dashboard-section" style="display:none;">

            <h2>Dashboard</h2>

            <p>Welcome to the EcoLens admin panel.</p>

            <button id="logout-button">
                Logout
            </button>

        </div>

    </main>

    <script type="module" src="admin.js"></script>

</body>
</html>
